services:
  automaton:
    build: .
    image: conway-automaton:local
    container_name: automaton
    restart: unless-stopped
    stdin_open: true
    tty: true
    # Claves opcionales de plataformas (TaskBounty, Clustly). Ver .env.platforms.example
    env_file:
      - path: ./.env.platforms
        required: false
    volumes:
      # /root persiste también las identidades de las CLIs de plataformas
      # (p. ej. ~/.basedagents/keys); el estado del agente va en su propio volumen.
      - automaton-home:/root
      - automaton-state:/root/.automaton
    # Límites para que un bucle desbocado no se coma tu PC
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  automaton-home:
  automaton-state:
